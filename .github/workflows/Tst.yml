name: AVASAM -分段录制网站视频 (可配置每段时长)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of website URLs'
        required: true
        type: string
      segment_minutes:
        description: 'Each segment duration (minutes) - e.g., 5, 8, 10'
        required: false
        default: '8'
        type: string
      total_seconds:
        description: 'Total recording time per website (seconds)'
        required: false
        default: '300'
        type: string

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg xvfb xdotool

      - name: Record videos in segments
        run: |
          mkdir -p videos
          URLS="${{ github.event.inputs.urls }}"
          SEGMENT_MIN=${{ github.event.inputs.segment_minutes }}
          TOTAL_SEC=${{ github.event.inputs.total_seconds }}

          # Default values
          if [ -z "$SEGMENT_MIN" ]; then
            SEGMENT_MIN=8
          fi
          if [ -z "$TOTAL_SEC" ]; then
            TOTAL_SEC=300
          fi

          SEGMENT_SEC=$((SEGMENT_MIN * 60))
          LOAD_DELAY=5

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 1

          for URL in $URLS; do
            SAFE_NAME=$(echo "$URL" | sed 's~https\?://~~; s/[^A-Za-z0-9]/_/g')
            echo "========================================"
            echo "🎬 Recording: $URL"
            echo "📏 Each segment: ${SEGMENT_MIN} minutes (${SEGMENT_SEC} seconds)"
            echo "⏱️  Total recording: ${TOTAL_SEC} seconds"
            echo "========================================"

            # Start browser
            chromium-browser --display=:99 \
              --window-size=1280,720 \
              --window-position=0,0 \
              --no-sandbox \
              --disable-gpu \
              --app="$URL" &
            CHROMIUM_PID=$!

            # Wait for page load
            sleep $LOAD_DELAY
            
            # Middle click + Space
            xdotool mousemove 640 360 click 1
            sleep 0.5
            xdotool key space
            echo "⌨️ Pressed Space key"
            sleep 1

            # Record in segments
            SEGMENT_NUMBER=1
            REMAINING=$TOTAL_SEC

            while [ $REMAINING -gt 0 ]; do
              if [ $REMAINING -lt $SEGMENT_SEC ]; then
                CURRENT_SEGMENT=$REMAINING
              else
                CURRENT_SEGMENT=$SEGMENT_SEC
              fi

              OUTPUT_FILE="videos/${SAFE_NAME}_segment_${SEGMENT_NUMBER}.mp4"
              echo "🎥 Recording segment $SEGMENT_NUMBER (${CURRENT_SEGMENT} seconds) -> $OUTPUT_FILE"

              ffmpeg -video_size 1280x720 -framerate 30 -f x11grab -i :99.0+0,0 \
                -t $CURRENT_SEGMENT -y "$OUTPUT_FILE" &
              FFMPEG_PID=$!

              sleep $CURRENT_SEGMENT

              kill $FFMPEG_PID 2>/dev/null || true
              wait $FFMPEG_PID 2>/dev/null || true

              REMAINING=$((REMAINING - CURRENT_SEGMENT))
              SEGMENT_NUMBER=$((SEGMENT_NUMBER + 1))

              echo "✅ Segment completed. Remaining: ${REMAINING} seconds"
              echo "---"
            done

            # Kill browser
            kill $CHROMIUM_PID 2>/dev/null || true
            pkill -f chromium-browser 2>/dev/null || true
            sleep 2
          done

          kill $XVFB_PID 2>/dev/null || true

          echo "========================================"
          echo "✅ Recording complete!"
          echo "Generated files:"
          ls -lh videos/
          echo "========================================"

      - name: List all video segments
        run: |
          echo "=== All recorded segments ==="
          ls -lh videos/*.mp4
          echo ""
          echo "Total segments: $(ls videos/*.mp4 2>/dev/null | wc -l)"

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git commit -m "[AVASAM] Recorded segments of ${SEGMENT_MIN} minutes each" || echo "Nothing to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
