name: AVASAM - Download Video with yt-dlp

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of video URLs'
        required: true
        type: string
      video_quality:
        description: 'Preferred video quality (e.g., 1080, 720, 480)'
        required: false
        default: '720'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3 # 此Action会自动安装yt-dlp和ffmpeg
        with:
          ffmpeg: true
          aria2: true

      - name: Download Videos
        run: |
          mkdir -p downloads
          URLS="${{ github.event.inputs.urls }}"
          QUALITY="${{ github.event.inputs.video_quality }}"

          for URL in $URLS; do
            echo "⬇️ Downloading $URL at ${QUALITY}p..."
            # 使用yt-dlp下载，并根据输入参数选择画质
            yt-dlp -f "bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]" \
                   --merge-output-format mp4 \
                   -o "downloads/%(title)s.%(ext)s" \
                   "$URL"
          done
        continue-on-error: true

      - name: List Downloaded Files
        run: ls -lh downloads/

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add downloads/
          git commit -m "[AVASAM] Downloaded videos via yt-dlp in ${QUALITY}p" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
