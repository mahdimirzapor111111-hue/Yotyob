name: 🎬 Erome Video Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو Erome (مثلاً https://www.erome.com/a/xxxxx)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Clone EromeDownloader
        run: git clone https://github.com/M4p4/EromeDownloader.git

      - name: 🧰 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r EromeDownloader/requirements.txt

      - name: ⬇️ Download video
        run: |
          mkdir -p downloads
          cd downloads
          python ../EromeDownloader/erome.py "${{ github.event.inputs.url }}"
          # فایل‌های دانلود شده مستقیماً در پوشه downloads قرار می‌گیرند
          cd ..

      - name: 📋 Show downloaded files
        run: ls -lh downloads/

      - name: 💾 Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add downloads/
          git commit -m "Downloaded Erome video: ${{ github.event.inputs.url }}" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
