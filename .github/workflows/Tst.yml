name: AVASAM - Stable Video Capture (No Frame Drop, Perfect Audio Sync)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of website URLs'
        required: true
        type: string
      record_seconds:
        description: 'Recording duration (seconds)'
        required: false
        default: '15'
        type: string

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg xdotool v4l2loopback-dkms pulseaudio

      - name: Setup virtual video device
        run: |
          sudo modprobe v4l2loopback devices=1 video_nr=0 card_label="ChromeCapture" exclusive_caps=1

      - name: Start PulseAudio
        run: |
          pulseaudio --start
          sleep 2

      - name: Record videos (Chrome internal capture)
        run: |
          mkdir -p videos
          URLS="${{ github.event.inputs.urls }}"
          RECORD_SECONDS=${{ github.event.inputs.record_seconds }}

          if [ "$RECORD_SECONDS" -lt 8 ]; then
            RECORD_SECONDS=8
          fi

          for URL in $URLS; do
            SAFE_NAME=$(echo "$URL" | sed 's~https\?://~~; s/[^A-Za-z0-9]/_/g')

            echo "🎥 Recording $URL for ${RECORD_SECONDS}s"

            # Start Chromium with internal screen capture
            chromium-browser \
              --no-sandbox \
              --autoplay-policy=no-user-gesture-required \
              --enable-usermedia-screen-capturing \
              --allow-http-screen-capture \
              --use-fake-ui-for-media-stream \
              --window-size=1280,720 \
              "$URL" &
            CHROME_PID=$!

            sleep 5

            # Press Space
            xdotool key space

            # Record from Chrome internal stream
            ffmpeg \
              -f v4l2 -i /dev/video0 \
              -f pulse -i default \
              -c:v libx264 -preset veryfast -crf 23 \
              -c:a aac \
              -t $RECORD_SECONDS \
              -y "videos/${SAFE_NAME}.mp4"

            kill $CHROME_PID || true
            pkill -f chromium-browser || true
            sleep 1
          done

      - name: List videos
        run: ls -lh videos/

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git commit -m "[AVASAM] Recorded ${RECORD_SECONDS}s video(s)" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
