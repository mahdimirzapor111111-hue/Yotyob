name: 🔗 Extract Link + Download

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'لینک(ها) با فاصله'
        required: true
        type: string

jobs:
  extract-and-download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip ffmpeg

      - name: 📦 Node & Playwright + Stealth
        run: |
          npm install playwright-extra playwright-extra-plugin-stealth
          npx playwright install --with-deps chromium

      - name: 🌙 Install latest yt-dlp
        run: |
          python3 -m pip install --force-reinstall \
            https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.tar.gz

      - name: 🎯 Extract Video Link (Only)
        id: extract
        run: |
          cat << 'SCRIPT' > extractor.mjs
          import { chromium } from 'playwright-extra';
          import StealthPlugin from 'playwright-extra-plugin-stealth';
          import fs from 'fs';

          chromium.use(StealthPlugin());

          const urls = process.env.URLS.split(' ').filter(Boolean);

          for (const pageUrl of urls) {
            console.log(`\n🔎 Target: ${pageUrl}`);
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();
            let videoUrl = null;

            // --- Intercept network ---
            page.on('response', async response => {
              const url = response.url();
              if (response.status() === 200 && (url.includes('.m3u8') || url.includes('.mp4'))) {
                if (!videoUrl || url.includes('.m3u8')) {
                  videoUrl = url;
                  console.log(`🌐 [Network] ${url}`);
                }
              }
            });

            // --- Navigate ---
            try {
              await page.goto(pageUrl, { waitUntil: 'networkidle', timeout: 40000 });
            } catch (e) {
              console.log('⚠️ Page load issue, continuing...');
            }

            // --- Click to play ---
            await page.mouse.click(640, 360);
            await page.waitForTimeout(3000);
            await page.keyboard.press('Space');
            await page.waitForTimeout(4000);

            // --- DOM probing ---
            if (!videoUrl) {
              console.log('🔎 Searching DOM...');
              videoUrl = await page.evaluate(() => {
                const v = document.querySelector('video');
                if (v?.src && !v.src.startsWith('blob:')) return v.src;
                const src = document.querySelector('video source');
                if (src?.src) return src.src;
                // هر المان با لینک m3u8/mp4
                for (const el of document.querySelectorAll('*')) {
                  for (const attr of el.attributes) {
                    if (attr.value.includes('.m3u8') || attr.value.includes('.mp4'))
                      return attr.value;
                  }
                }
                // داخل script ها
                for (const s of document.querySelectorAll('script')) {
                  const m = s.textContent.match(/(https?:\/\/[^\s"']+\.(m3u8|mp4)[^\s"']*)/i);
                  if (m) return m[1];
                }
                return null;
              });
              if (videoUrl) console.log(`🖥️ [DOM] ${videoUrl}`);
            }

            // --- Fallback: wait more ---
            if (!videoUrl) {
              console.log('⏳ Waiting extra 5s...');
              await page.waitForTimeout(5000);
              videoUrl = await page.evaluate(() => {
                const v = document.querySelector('video');
                return v?.src && !v.src.startsWith('blob:') ? v.src : null;
              });
              if (videoUrl) console.log(`🕒 [Late] ${videoUrl}`);
            }

            const domain = new URL(pageUrl).hostname.replace(/[^a-zA-Z0-9]/g, '_');
            if (videoUrl) {
              fs.writeFileSync(`video_url_${domain}.txt`, videoUrl);
              console.log(`✅ SUCCESS → video_url_${domain}.txt`);
            } else {
              console.log(`❌ FAILED to extract link for ${pageUrl}`);
              process.exit(1); // fail the step
            }

            await browser.close();
          }
          SCRIPT

          export URLS="${{ github.event.inputs.urls }}"
          node extractor.mjs

      - name: 📥 Download using extracted URL
        run: |
          mkdir -p downloads
          for f in video_url_*.txt; do
            url=$(cat "$f")
            echo "⬇️ Downloading $url"
            yt-dlp --merge-output-format mp4 -o "downloads/%(title).200s.%(ext)s" "$url"
          done

      - name: 📋 List downloads
        run: ls -lh downloads/

      - name: 💾 Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add downloads/
          git commit -m "[Extract] Downloaded video" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
