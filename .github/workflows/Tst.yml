
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git commit -m "[AVASAM] Recorded ${RECORD_SECONDS}s video(s)" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
name: AVASAM - Website Video with Space Key (Audio + Split)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of website URLs'
        required: true
        type: string
      record_seconds:
        description: 'Recording duration (seconds), including page load'
        required: false
        default: '15'
        type: string

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg xvfb xdotool pulseaudio pulseaudio-utils

      - name: Setup virtual audio device (PulseAudio)
        run: |
          # Start PulseAudio for the current user (no system mode needed)
          pulseaudio --start
          # Create a virtual sink (null output)
          pactl load-module module-null-sink sink_name=virtual_sink
          # Set it as default so Chromium outputs audio to it
          pactl set-default-sink virtual_sink
          echo "✅ Virtual audio sink 'virtual_sink' created"

      - name: Record videos with keyboard press (Space)
        run: |
          mkdir -p videos
          URLS="${{ github.event.inputs.urls }}"
          RECORD_SECONDS=${{ github.event.inputs.record_seconds }}

          # حداقل زمان ۸ ثانیه
          if [ "$RECORD_SECONDS" -lt 8 ]; then
            echo "⚠️ Minimum recommended is 8 seconds. Using 8."
            RECORD_SECONDS=8
          fi

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 1

          LOAD_DELAY=5
          MAX_FILE_SIZE=$((90 * 1024 * 1024))   # 90 MB

          for URL in $URLS; do
            SAFE_NAME=$(echo "$URL" | sed 's~https\?://~~; s/[^A-Za-z0-9]/_/g')
            echo "📹 Recording $URL for ${RECORD_SECONDS}s (with audio)"

            # ضبط همزمان تصویر و صدا با یک ffmpeg برای هماهنگی کامل
            ffmpeg \
              -video_size 1280x720 -framerate 30 -f x11grab -i :99.0+0,0 \
              -f pulse -i virtual_sink.monitor \
              -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -vsync 1 -async 1 -af "aresample=async=1:first_pts=0" \
              -shortest \
              -t $RECORD_SECONDS \
              -y "videos/${SAFE_NAME}.mp4" &
            FFMPEG_PID=$!

            chromium-browser --display=:99 \
              --window-size=1280,720 \
              --window-position=0,0 \
              --no-sandbox \
              --disable-gpu \
              --app="$URL" &
            CHROMIUM_PID=$!

            # صبر برای بارگذاری اولیه
            sleep $LOAD_DELAY

            # کلیک وسط صفحه و فشردن Space
            xdotool mousemove 640 360 click 1
            sleep 0.5
            xdotool key space
            echo "⌨️ Pressed Space key"

            # صبر برای باقی‌مانده زمان ضبط
            REMAIN=$((RECORD_SECONDS - LOAD_DELAY - 1))
            if [ "$REMAIN" -gt 0 ]; then
              sleep $REMAIN
            fi

            # پایان ضبط
            kill $FFMPEG_PID 2>/dev/null || true
            wait $FFMPEG_PID 2>/dev/null || true
            kill $CHROMIUM_PID 2>/dev/null || true
            pkill -f chromium-browser 2>/dev/null || true

            # بررسی حجم فایل و تقسیم در صورت نیاز
            VIDEO_PATH="videos/${SAFE_NAME}.mp4"
            if [ -f "$VIDEO_PATH" ]; then
              FILE_SIZE=$(stat -c%s "$VIDEO_PATH" 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -gt "$MAX_FILE_SIZE" ]; then
                echo "⚠️ File size ($FILE_SIZE bytes) exceeds 90 MB. Splitting into parts..."
                split -b 90M "$VIDEO_PATH" "${VIDEO_PATH}.part"
                rm "$VIDEO_PATH"
                echo "✅ Split into $(ls ${VIDEO_PATH}.part* | wc -l) parts."
              else
                echo "✅ File size is safe (${FILE_SIZE} bytes). No split needed."
              fi
            fi

            sleep 1
          done

          kill $XVFB_PID 2>/dev/null || true

      - name: List videos
        run: ls -lh videos/

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git commit -m "[AVASAM] Recorded ${RECORD_SECONDS}s video(s) with audio" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
