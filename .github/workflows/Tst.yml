name: AVASAM - Perfect Sync (Video + Audio Separate, With Play Click)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of website URLs'
        required: true
        type: string
      record_seconds:
        description: 'Recording duration (seconds)'
        required: false
        default: '15'
        type: string

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg xdotool pulseaudio xvfb

      - name: Start Xvfb
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          echo $! > xvfb.pid
          sleep 1

      - name: Start PulseAudio
        run: |
          pulseaudio --start
          sleep 2

      - name: Record videos (Video + Audio Separate + Play Click)
        run: |
          export DISPLAY=:99
          mkdir -p videos
          URLS="${{ github.event.inputs.urls }}"
          RECORD_SECONDS=${{ github.event.inputs.record_seconds }}

          if [ "$RECORD_SECONDS" -lt 8 ]; then
            RECORD_SECONDS=8
          fi

          for URL in $URLS; do
            SAFE_NAME=$(echo "$URL" | sed 's~https\?://~~; s/[^A-Za-z0-9]/_/g')

            echo "🎥 Recording $URL for ${RECORD_SECONDS}s"

            # Start Chromium
            chromium-browser \
              --display=:99 \
              --no-sandbox \
              --disable-gpu \
              --autoplay-policy=no-user-gesture-required \
              --window-size=1280,720 \
              "$URL" &
            CHROME_PID=$!

            sleep 5

            # CLICK PLAY (center of screen)
            xdotool mousemove 640 360 click 1
            sleep 0.5

            # Press Space (for animations)
            xdotool key space

            # Record VIDEO only
            ffmpeg \
              -video_size 1280x720 \
              -framerate 30 \
              -f x11grab -i :99.0 \
              -t $RECORD_SECONDS \
              -y "videos/${SAFE_NAME}_video.mp4"

            # Record AUDIO only
            ffmpeg \
              -f pulse -i default \
              -t $RECORD_SECONDS \
              -y "videos/${SAFE_NAME}_audio.wav"

            # Merge audio + video
            ffmpeg \
              -i "videos/${SAFE_NAME}_video.mp4" \
              -i "videos/${SAFE_NAME}_audio.wav" \
              -c:v copy -c:a aac \
              -y "videos/${SAFE_NAME}.mp4"

            kill $CHROME_PID || true
            pkill -f chromium-browser || true
            sleep 1
          done

      - name: Cleanup temp files
        run: rm -f videos/*_video.mp4 videos/*_audio.wav

      - name: List videos
        run: ls -lh videos/

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git commit -m "[AVASAM] Final synced videos recorded" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
