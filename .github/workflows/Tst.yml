name: Universal Video Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL صفحهٔ ویدیو'
        required: true
        type: string
      output_folder:
        description: 'پوشهٔ ذخیرهٔ فایل‌ها در ریپو'
        required: false
        type: string
        default: 'downloads'
      archive_name:
        description: 'نام پایهٔ آرشیو RAR (اگر فایل تقسیم شود)'
        required: false
        type: string
        default: 'video'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp, bc, rar
        run: |
          pip install yt-dlp
          sudo apt-get update
          sudo apt-get install -y bc rar

      - name: Download video (universal auto-detect)
        id: download
        shell: bash
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"
          touch marker

          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Download attempt $((RETRY_COUNT+1))/$MAX_RETRIES"

            yt-dlp \
              --output "./$FOLDER/%(title)s-%(id)s.%(ext)s" \
              --format "bestvideo*+bestaudio/best" \
              --merge-output-format mp4 \
              --retries 10 \
              --fragment-retries 20 \
              --no-check-certificate \
              --geo-bypass \
              --no-color \
              --ignore-errors \
              --newline \
              "${{ github.event.inputs.url }}" && {

                NEW_FILE=$(find "$FOLDER" -type f -newer marker -print -quit)
                if [ -n "$NEW_FILE" ]; then
                  echo "Download succeeded: $NEW_FILE"
                  SUCCESS=true
                  break
                else
                  echo "Download exited 0 but no new file found. Retrying..."
                fi
              } || {
                echo "Download failed with exit code $?"
              }

            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Waiting 5 seconds before next attempt..."
              sleep 5
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "Error: All $MAX_RETRIES download attempts failed."
            exit 1
          fi

          FILENAME=$(basename "$NEW_FILE")
          SIZE_BYTES=$(stat -c %s "$NEW_FILE")
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "Downloaded: $NEW_FILE (${SIZE_BYTES} bytes)"

      - name: Conditional split (if file > 99 MB)
        id: split
        shell: bash
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          SIZE_BYTES="${{ steps.download.outputs.size_bytes }}"
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          THRESHOLD_MB=99

          cd "$FOLDER"

          if (( $(echo "$SIZE_MB > $THRESHOLD_MB" | bc -l) )); then
            echo "File size ${SIZE_MB} MB exceeds ${THRESHOLD_MB} MB – splitting into 95 MB RAR parts."
            RANDOM_HEX=$(openssl rand -hex 3)
            ARCHIVE_NAME="${{ github.event.inputs.archive_name }}_${RANDOM_HEX}"
            echo "Archive base name: ${ARCHIVE_NAME}"
            rar a -v95m -m5 -ep1 "${ARCHIVE_NAME}.rar" "$FILENAME"
            rm "$FILENAME"
            echo "split_done=true" >> $GITHUB_OUTPUT
            echo "Split completed. Parts created:"
            ls -lh "${ARCHIVE_NAME}.part"*.rar
          else
            echo "File size ${SIZE_MB} MB is ≤ ${THRESHOLD_MB} MB – keeping original file."
            echo "split_done=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to repository
        shell: bash
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FOLDER/"
          git commit -m "Add downloaded video(s)" || echo "Nothing to commit."
          git push || echo "Nothing to push (maybe no changes)."
