name: 🎭 AVASAM - Playwright Hunter + yt-dlp

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'لیست لینک‌ها (با فاصله جدا کن)'
        required: true
        type: string
      referer:
        description: 'هدر Referer (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip ffmpeg

      - name: 📦 Install Node.js and Playwright
        run: |
          npm install playwright   # <--- این خط رو اضافه کردیم
          npx playwright install --with-deps chromium

      - name: 🌙 Install latest yt-dlp
        run: |
          python3 -m pip install --force-reinstall \
            https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.tar.gz

      - name: 🕵️ Run Playwright extractor
        run: |
          cat << 'EOF' > extractor.mjs
          import { chromium } from 'playwright';
          import fs from 'fs';

          const urls = process.env.URLS.split(' ').filter(Boolean);
          const referer = process.env.REFERER || '';

          for (const videoPageUrl of urls) {
            console.log(`\n🔍 Processing: ${videoPageUrl}`);
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
            });

            if (referer) {
              await context.setExtraHTTPHeaders({ Referer: referer });
            }

            const page = await context.newPage();
            let videoUrl = null;

            page.on('response', async (response) => {
              const url = response.url();
              const status = response.status();
              if (status === 200 && (url.includes('.m3u8') || url.includes('.mp4') || url.includes('.ts'))) {
                if (!videoUrl || url.includes('.m3u8') || (url.includes('.mp4') && !videoUrl.includes('.m3u8'))) {
                  videoUrl = url;
                  console.log(`🎯 Candidate found: ${url}`);
                }
              }
            });

            try {
              await page.goto(videoPageUrl, { waitUntil: 'networkidle', timeout: 30000 });
            } catch (e) {
              console.log(`⚠️ Page load timeout, continuing...`);
            }

            console.log('🖱️ Clicking center to play...');
            await page.mouse.click(640, 360);
            await page.waitForTimeout(2000);
            await page.keyboard.press('Space');
            await page.waitForTimeout(3000);

            if (!videoUrl) {
              console.log('⌛ Waiting extra for video...');
              await page.waitForTimeout(5000);
            }

            if (videoUrl) {
              const domain = new URL(videoPageUrl).hostname;
              const safeName = domain.replace(/[^a-zA-Z0-9]/g, '_');
              fs.writeFileSync(`video_url_${safeName}.txt`, videoUrl);

              const cookies = await context.cookies();
              let cookieTxt = '# Netscape HTTP Cookie File\n';
              for (const c of cookies) {
                cookieTxt += [
                  c.domain.startsWith('.') ? c.domain : '.' + c.domain,
                  'TRUE',
                  c.path,
                  c.secure ? 'TRUE' : 'FALSE',
                  c.expires > 0 ? Math.floor(c.expires) : 0,
                  c.name,
                  c.value,
                ].join('\t') + '\n';
              }
              fs.writeFileSync(`cookies_${safeName}.txt`, cookieTxt);
              console.log(`✅ Video URL saved to video_url_${safeName}.txt`);
            } else {
              console.log('❌ No video URL found.');
            }

            await browser.close();
          }
          EOF

          URLS="${{ github.event.inputs.urls }}"
          REFERER="${{ github.event.inputs.referer }}"
          export URLS REFERER
          node extractor.mjs

      - name: 📥 Download videos using extracted URL + cookies
        run: |
          mkdir -p downloads
          for FILE in video_url_*.txt; do
            [ -f "$FILE" ] || continue
            DOMAIN=$(echo "$FILE" | sed 's/video_url_//; s/\.txt//')
            VIDEO_URL=$(cat "$FILE")
            COOKIES_FILE="cookies_${DOMAIN}.txt"

            echo "⬇️ Downloading from: $VIDEO_URL"
            if [ -f "$COOKIES_FILE" ]; then
              yt-dlp --cookies "$COOKIES_FILE" --merge-output-format mp4 -o "downloads/%(title).200s.%(ext)s" "$VIDEO_URL"
            else
              yt-dlp --merge-output-format mp4 -o "downloads/%(title).200s.%(ext)s" "$VIDEO_URL"
            fi
          done
        continue-on-error: true

      - name: 📋 Show downloads
        run: ls -lh downloads/

      - name: 💾 Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add downloads/
          git commit -m "[AVASAM] Playwright extracted & downloaded" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
