name: AVASAM - Website Video with Space Key (Configurable Duration)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of website URLs'
        required: true
        type: string
      record_seconds:
        description: 'Recording duration (seconds), including page load'
        required: false
        default: '15'
        type: string

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg xvfb xdotool zip

      - name: Record videos with keyboard press (Space)
        run: |
          mkdir -p videos
          URLS="${{ github.event.inputs.urls }}"
          RECORD_SECONDS=${{ github.event.inputs.record_seconds }}

          # Minimum recommended duration
          if [ "$RECORD_SECONDS" -lt 8 ]; then
            echo "⚠️ Minimum recommended is 8 seconds. Using 8."
            RECORD_SECONDS=8
          fi

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 1

          LOAD_DELAY=5   # wait before Space key press

          for URL in $URLS; do
            SAFE_NAME=$(echo "$URL" | sed 's~https\?://~~; s/[^A-Za-z0-9]/_/g')
            echo "📹 Recording $URL for ${RECORD_SECONDS}s"

            ffmpeg -video_size 1280x720 -framerate 30 -f x11grab -i :99.0+0,0 \
              -t $RECORD_SECONDS -y "videos/${SAFE_NAME}.mp4" &
            FFMPEG_PID=$!

            chromium-browser --display=:99 \
              --window-size=1280,720 \
              --window-position=0,0 \
              --no-sandbox \
              --disable-gpu \
              --app="$URL" &
            CHROMIUM_PID=$!

            sleep $LOAD_DELAY

            # Middle click + Space
            xdotool mousemove 640 360 click 1
            sleep 0.5
            xdotool key space
            echo "⌨️ Pressed Space key"

            REMAIN=$((RECORD_SECONDS - LOAD_DELAY - 1))
            if [ "$REMAIN" -gt 0 ]; then
              sleep $REMAIN
            fi

            kill $FFMPEG_PID 2>/dev/null || true
            wait $FFMPEG_PID 2>/dev/null || true
            kill $CHROMIUM_PID 2>/dev/null || true
            pkill -f chromium-browser 2>/dev/null || true

            sleep 1
          done

          kill $XVFB_PID 2>/dev/null || true

          # Package videos into ZIP (multi-part if needed for GitHub limit)
          echo "📦 Creating ZIP archive of all videos..."
          cd videos
          # Use split ZIP if total size > 90MB, with 90MB per part
          zip -r -s 90m ../videos.zip .
          cd ..

          # Remove raw video files to keep repository clean
          rm -rf videos

      - name: List generated ZIP files
        run: ls -lh videos.zip* 2>/dev/null || echo "No ZIP files found"

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos.zip*
          git commit -m "[AVASAM] Recorded ${RECORD_SECONDS}s video(s) - ZIP archive" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
