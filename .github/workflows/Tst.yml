- name: Download video (universal auto-detect)
  id: download
  run: |
    FOLDER="${{ github.event.inputs.output_folder }}"
    mkdir -p "$FOLDER"
    touch marker

    MAX_RETRIES=5
    RETRY_COUNT=0
    SUCCESS=false

    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      echo "Download attempt $((RETRY_COUNT+1))/$MAX_RETRIES"

      yt-dlp \
        --output "./$FOLDER/%(title)s-%(id)s.%(ext)s" \
        --format "bestvideo*+bestaudio/best" \
        --merge-output-format mp4 \
        --retries 10 \
        --fragment-retries 20 \
        --no-check-certificate \
        --geo-bypass \
        --no-color \
        --ignore-errors \
        --newline \
        "${{ github.event.inputs.url }}" && {

          NEW_FILE=$(find "$FOLDER" -type f -newer marker -print -quit)
          if [ -n "$NEW_FILE" ]; then
            echo "Download succeeded: $NEW_FILE"
            SUCCESS=true
            break
          else
            echo "Download exited 0 but no file created. Retrying..."
          fi
        } || {
          echo "Download failed with exit code $?"
        }

      RETRY_COUNT=$((RETRY_COUNT+1))
      if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
        echo "Waiting 5 seconds..."
        sleep 5
      fi
    done

    if [ "$SUCCESS" = false ]; then
      echo "Error: All attempts failed."
      exit 1
    fi

    FILENAME=$(basename "$NEW_FILE")
    SIZE_BYTES=$(stat -c %s "$NEW_FILE")
    echo "filename=$FILENAME" >> $GITHUB_OUTPUT
    echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
