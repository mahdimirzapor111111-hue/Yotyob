name: AVASAM - Website Video with Space Key (Keyboard)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of website URLs'
        required: true
        type: string

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg xvfb xdotool

      - name: Record videos with keyboard press (Space)
        run: |
          mkdir -p videos
          URLS="${{ github.event.inputs.urls }}"

          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 1

          RECORD_SECONDS=12      # کل زمان ضبط (کمی بیشتر از نیاز)
          LOAD_DELAY=5           # مدت زمان بارگذاری اولیه

          for URL in $URLS; do
            SAFE_NAME=$(echo "$URL" | sed 's~https\?://~~; s/[^A-Za-z0-9]/_/g')
            echo "📹 Recording $URL (load + space key)"

            # شروع ضبط صفحه نمایش
            ffmpeg -video_size 1280x720 -framerate 30 -f x11grab -i :99.0+0,0 -t $RECORD_SECONDS -y "videos/${SAFE_NAME}.mp4" &
            FFMPEG_PID=$!

            # باز کردن مرورگر Chromium در حالت app
            chromium-browser --display=:99 \
              --window-size=1280,720 \
              --window-position=0,0 \
              --no-sandbox \
              --disable-gpu \
              --app="$URL" &
            CHROMIUM_PID=$!

            # صبر برای بارگذاری صفحه
            sleep $LOAD_DELAY

            # کلیک در وسط صفحه برای گرفتن فوکوس توسط پلیر
            xdotool mousemove 640 360 click 1
            sleep 0.5

            # زدن کلید Space برای پخش ویدیو
            xdotool key space
            echo "⌨️ Pressed Space key"

            # صبر تا پایان ضبط (باقی‌ماندهٔ RECORD_SECONDS)
            REMAIN=$((RECORD_SECONDS - LOAD_DELAY - 1))
            sleep $REMAIN

            # متوقف کردن ffmpeg و مرورگر
            kill $FFMPEG_PID 2>/dev/null || true
            wait $FFMPEG_PID 2>/dev/null || true
            kill $CHROMIUM_PID 2>/dev/null || true
            pkill -f chromium-browser 2>/dev/null || true

            sleep 1
          done

          kill $XVFB_PID 2>/dev/null || true

      - name: List videos
        run: ls -lh videos/

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git commit -m "[AVASAM] Recorded with Space key press" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
