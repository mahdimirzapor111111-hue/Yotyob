name: AVASAM - Video Downloader (YouTube Ready)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of YouTube URLs'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Node.js & yt-dlp with EJS support
        run: |
          # نصب Node.js به عنوان یک JavaScript Runtime
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          
          # نصب yt-dlp و yt-dlp-ejs از طریق pip
          sudo pip3 install yt-dlp yt-dlp-ejs

      - name: Configure yt-dlp for YouTube
        run: |
          # ایجاد فایل کانفیگ برای استفاده از Node.js
          mkdir -p ~/.config/yt-dlp
          cat > ~/.config/yt-dlp/config << 'EOF'
          --js-runtimes node
          --remote-components ejs:github
          --impersonate chrome
          --no-playlist
          -f bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best
          --merge-output-format mp4
          EOF

      - name: Download YouTube Videos
        run: |
          URLS="${{ github.event.inputs.urls }}"
          mkdir -p videos

          for URL in $URLS; do
            echo "🎬 Processing YouTube: $URL"
            yt-dlp --verbose "$URL" -o "videos/%(title)s_%(id)s.%(ext)s" || echo "⚠️ Failed to download from $URL"
          done

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git commit -m "[AVASAM] Download YouTube videos" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
