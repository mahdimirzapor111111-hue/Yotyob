name: AVASAM - Website Screenshot (Native Chrome)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of website URLs'
        required: true
        type: string

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Take screenshots
        run: |
          mkdir -p screenshots
          URLS="${{ github.event.inputs.urls }}"

          for URL in $URLS; do
            SAFE_NAME=$(echo "$URL" | sed 's~https\?://~~; s/[^A-Za-z0-9]/_/g')
            echo "📸 Capturing $URL"
            # گزینه‌های کروم: پنجره 1280x720، ذخیره screenshot، صبر برای بارگذاری کامل
            chromium-browser --headless=new \
              --window-size=1280,720 \
              --screenshot="screenshots/${SAFE_NAME}.png" \
              --timeout=30000 \
              --virtual-time-budget=10000 \
              "$URL" || echo "⚠️ Failed: $URL"
            sleep 2
          done

      - name: List screenshots
        run: ls -lh screenshots/

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add screenshots/
          git commit -m "[AVASAM] Add website screenshots" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
