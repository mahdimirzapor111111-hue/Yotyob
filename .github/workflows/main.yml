name: AVASAM - Video Downloader Only

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of website or video URLs'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install yt-dlp
        run: |
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download videos
        run: |
          URLS="${{ github.event.inputs.urls }}"
          mkdir -p videos

          for URL in $URLS; do
            echo "🎬 Processing: $URL"
            yt-dlp \
              --ignore-errors \
              --no-playlist \
              --format "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --merge-output-format mp4 \
              --output "videos/%(title)s_%(id)s.%(ext)s" \
              "$URL" || echo "⚠️ Failed to download from $URL"
          done

      - name: List downloaded files
        run: |
          echo "📁 Downloaded files:"
          ls -lh videos/ || echo "No files found"

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add videos/
          git commit -m "[AVASAM] Download videos from provided URLs" || echo "Nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
